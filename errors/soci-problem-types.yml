note: >-
  SOCi publishes no OpenAPI and no public error reference, so this catalog is not
  derived from 4xx/5xx spec responses and is not copied from documentation. It
  records only error responses observed directly on the wire. It is therefore a
  partial catalog — the authenticated error surface is unknown.
envelope:
  fields:
  - name: status
    type: string
    value_on_error: error
  - name: error
    type: string
    description: Human-readable message
  - name: error_tracking_id
    type: string
    description: Opaque server-side correlation id, format error_<hex>.<hex>
  http_status: 200
  concern: >-
    Errors are signalled in the body while the HTTP status stays 200. There is no
    machine-readable error code, no type URI, and no problem+json content type, so
    error handling cannot be generated from any contract and agent runtimes that
    branch on HTTP status will read every failure as a success.
