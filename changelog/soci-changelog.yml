note: >-
  SOCi publishes a public, dated product release-notes stream, but it is a
  product changelog rather than an API changelog: entries are organized by
  product area (Search, Social, Core) and name UI features. API changes appear
  only as passing mentions inside feature notes — the June '26 notes, for
  example, say a new Google Business Profile secondary-phone-number field is
  manageable "via UI, API, and CSV" without naming an endpoint, field, or
  version. There is no separate API changelog, no breaking-change register, and
  no version numbers. Third-party integrators are pointed at the customer-only
  reference at uni-select.meetsoci.com/docs for "the latest API changes".
