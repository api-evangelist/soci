aid: soci
name: SOCi
description: 'SOCi, Inc. is a San Diego-based marketing platform for multi-location
  brands, franchises and enterprises, marketed as an "agentic workforce" for localized
  marketing. The SOCi Genius platform centralizes local search and listings management,
  reputation and review management, social publishing and engagement, local advertising,
  surveys and reporting across 140+ connected platforms including Google Business Profile,
  Facebook, Instagram, Yelp, Apple Business Connect and TikTok. SOCi exposes a REST
  API at app.meetsoci.com/api authenticated with a per-user API key issued from the
  platform''s User Settings screen, but the developer reference is served only to
  signed-in customers; there is no public developer portal, published OpenAPI, or
  self-serve sign-up.'
