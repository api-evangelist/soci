apis:
- name: SOCi Platform API
  description: 'SOCi''s customer-facing REST API, reachable at https://app.meetsoci.com/api.
    Authentication uses a per-user SOCi API key issued from User Settings inside the
    platform, together with the customer''s organization name and platform domain.
    The endpoint reference is published at https://uni-select.meetsoci.com/docs/index.html
    but that URL serves the SOCi application sign-in page to anonymous visitors, so
    the operation-level contract is customer-only. Anonymous probing of the API root
    confirms the service is live and returns a JSON error envelope.'
  humanURL: https://uni-select.meetsoci.com/docs/index.html
  baseURL: https://app.meetsoci.com/api
